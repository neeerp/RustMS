services:
  db:
    image: postgres:16
    stop_grace_period: 100ms
    environment:
      POSTGRES_USER: maplestory
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: maplestory_test
    ports:
      - "${HARNESS_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maplestory -d maplestory_test"]
      interval: 1s
      timeout: 5s
      retries: 30

  login:
    image: ${HARNESS_IMAGE:-rustms-server:integration}
    stop_grace_period: 100ms
    build:
      context: ..
      dockerfile: Dockerfile.rustms-server
      args:
        TARGET_CACHE_ID: rustms-target-${HARNESS_PROJECT_NAME:-rustms-integration}
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-}
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUSTMS_DATABASE_URL: postgres://maplestory:pass@db:5432/maplestory_test
      RUSTMS_LOGIN_BIND_ADDR: 0.0.0.0:8484
      RUSTMS_LOGIN_CHANNELS: Scania-1@127.0.0.1:${HARNESS_WORLD_PORT:-18485}@700;Scania-2@127.0.0.1:${HARNESS_WORLD_PORT_2:-18486}@700;Scania-3@127.0.0.1:${HARNESS_WORLD_PORT_3:-18487}@700
    volumes:
      - ${HARNESS_ASSETS_DIR:-../assets}:/app/assets:ro
    ports:
      - "${HARNESS_LOGIN_PORT:-18484}:8484"
    command: ["/usr/local/bin/login"]

  world:
    image: ${HARNESS_IMAGE:-rustms-server:integration}
    stop_grace_period: 100ms
    depends_on:
      db:
        condition: service_healthy
    environment:
      RUSTMS_DATABASE_URL: postgres://maplestory:pass@db:5432/maplestory_test
      RUSTMS_WORLD_BIND_HOST: 0.0.0.0
      RUSTMS_ALLOW_DEBUG_WARPS: "1"
      # Every kill drops its Monster Book card (see tests/monster_book.rs).
      RUSTMS_CARD_DROP_RATE: "1"
      # Ships sail 60 times as fast: a trip takes 15 seconds (see
      # tests/ships.rs).
      RUSTMS_CONTI_SCALE: "60"
      # Party events run 60 times as fast: Kerning City's party quest lasts
      # 30 seconds (see tests/kpq.rs).
      RUSTMS_EVENT_SCALE: "60"
      # Cloto asks every member of Kerning City's party quest her last
      # question, whose answer is 8 coupons (see tests/kpq_stage1.rs).
      RUSTMS_KPQ_QUESTION: "7"
      # Cloto's puzzles on stages 2-4 are all the second set of three areas,
      # 0, 1 and 3 (see tests/kpq_stages.rs).
      RUSTMS_KPQ_COMBO: "1"
      # Orbis's music box plays Tuesday's record, and Eak's sealed room
      # wants two, one and none on its platforms (see tests/opq_music.rs).
      RUSTMS_OPQ_DAY: "2"
      RUSTMS_OPQ_SPLIT: "210"
      # Its lounge's climb wants the second pad then the third, its tall
      # room's 1, 2, 3, 4 over and over, and Eak the first and fourth
      # levers (see tests/opq_levers.rs).
      RUSTMS_OPQ_LOUNGE: "23"
      RUSTMS_OPQ_TOWER: "1234123412341234"
      RUSTMS_OPQ_LEVERS: "14"
      # Every Gachapon roll is the same uncommon prize, which the world hears
      # of (see tests/gachapon.rs).
      RUSTMS_GACHAPON_SEED: "10"
      # The Crimson Balrog attacks every Ellinia-Orbis trip.
      RUSTMS_CONTI_BALROG: "100"
      # Every spawn point keeps a mob, bosses too, rather than the v83 rule
      # of a few mobs per map and bosses after a wait (see
      # agent_docs/combat.md). Override with 0 to try the v83 rule.
      RUSTMS_FULL_SPAWN: ${RUSTMS_FULL_SPAWN:-1}
      RUSTMS_LOGIN_CHANNELS: Scania-1@127.0.0.1:${HARNESS_WORLD_PORT:-18485}@700;Scania-2@127.0.0.1:${HARNESS_WORLD_PORT_2:-18486}@700;Scania-3@127.0.0.1:${HARNESS_WORLD_PORT_3:-18487}@700
    volumes:
      - ${HARNESS_ASSETS_DIR:-../assets}:/app/assets:ro
    # Each channel listens on its advertised port, so map them one-to-one.
    ports:
      - "${HARNESS_WORLD_PORT:-18485}:${HARNESS_WORLD_PORT:-18485}"
      - "${HARNESS_WORLD_PORT_2:-18486}:${HARNESS_WORLD_PORT_2:-18486}"
      - "${HARNESS_WORLD_PORT_3:-18487}:${HARNESS_WORLD_PORT_3:-18487}"
    command: ["/usr/local/bin/world"]
