"cwk.lore.warrior.hub" = "[placeholder] The Warrior Chamber tests a warrior's will: the room itself fights back. Shake off its effects, defeat its guardians, and claim the chamber's sword."
"cwk.lore.archer.hub" = "[placeholder] The Bowman Chamber tests a bowman's aim: its guardians must fall from afar. Defeat them all and claim the chamber's bow."
"cwk.lore.mage.hub" = "[placeholder] The Magician Chamber tests a magician's wits: it is a maze. Find the way through, defeat what waits there, and claim the chamber's staff."
"cwk.lore.thief.hub" = "[placeholder] The Thief Chamber tests a thief's speed: its watchful eyes must all be struck by a skill that moves you. Strike them all and claim the chamber's claw."
"cwk.lore.pirate.hub" = "[placeholder] The Pirate Chamber tests a pirate's luck: one of its chests holds the chamber's weapon. Find it and bring it back."
"cwk.lore.warrior.courtyard" = "[placeholder] A family of warrior heroes founded the Stormcasters, each generation inheriting the last one's arts."
"cwk.lore.archer.courtyard" = "[placeholder] A line of bowman heroes guarded the Stormcasters from afar, never missing a mark."
"cwk.lore.mage.courtyard" = "[placeholder] A circle of magician heroes kept the Stormcasters' lore and spells."
"cwk.lore.thief.courtyard" = "[placeholder] A band of thief heroes served the Stormcasters as their eyes in the shadows."
"cwk.lore.pirate.courtyard" = "[placeholder] A crew of pirate heroes sailed with the Stormcasters wherever the fight led."
"cwk.host.welcome.1" = "[placeholder] Welcome to the Twisted Masters' keep. I'll be your host tonight."
"cwk.host.welcome.2" = "[placeholder] A whole squad of Maplers for dinner... how delightful."
"cwk.host.welcome.3" = "[placeholder] Allow our finest Master Guardians to show you in!"
"cwk.host.escorting" = "[placeholder] Don't mind me. The Master Guardians will see to you."
"cwk.host.escort_beaten" = "[placeholder] Hm? You got past the guardians?"
"cwk.host.masters" = "[placeholder] No matter. The Twisted Masters themselves will greet you."
"cwk.host.masters_escorting" = "[placeholder] Don't mind me. The Twisted Masters will see to you."
"cwk.host.beaten" = "[placeholder] What? No... this can't be!"
"cwk.host.well_played" = "[placeholder] You've beaten the Twisted Masters. Well fought. Go through the portal for your reward."
"cwk.host.leader" = "[placeholder] Send your leader to speak with me."
"cwk.escort.out" = "[placeholder] The Master Guardians are coming!"
"cwk.masters.out" = "[placeholder] The Twisted Masters are coming!"
"cwk.boss.open" = "[placeholder] The portal onward has opened!"
"cwk.guardians.detected" = "[placeholder] The Master Guardians have found you."
"cwk.jack.idle" = "[placeholder] Nothing's going on in here right now."
"cwk.jack.stage1.1" = "[placeholder] You're in! Listen, they've already spotted us. Master Guardians will be here in about a minute, so hurry."
"cwk.jack.stage1.2" = "[placeholder] The portal to the Twisted Masters is broken. We'll have to go the long way, past plenty of traps."
"cwk.jack.stage1.3" = "[placeholder] The way on is hidden somewhere near here. Find it fast. I'll follow."
"cwk.jack.stage2.1" = "[placeholder] That worked! To get through here, we'll need one adventurer of every class."
"cwk.jack.stage2.2" = "[placeholder] Each of them has to use a skill on one of these Sigils. Once all five are lit, the way opens."
"cwk.jack.stage3.1" = "[placeholder] More Sigils here. At least five adventurers must climb to the very top and take the portal there. Careful: some of the walls and floors aren't what they look like."
"cwk.jack.stage3.2" = "[placeholder] And watch out for the Menhirs. They hit hard. Good luck."
"cwk.jack.stage4.1" = "[placeholder] Sigils again, but some of these are duds. Every class has a part: each wakes to its own job's skills, and a job may have more than one, so try them all."
"cwk.jack.stage4.2" = "[placeholder] The Stirges are only a distraction. Get five adventurers onto the middle-left platform at once to be rid of them. Keep trying the Sigils until they work."
"cwk.jack.stage5.1" = "[placeholder] You made it this far? That's the Keep's statue, stripped of its weapons."
"cwk.jack.stage5.2" = "[placeholder] There are five rooms around it, each marked by a statue."
"cwk.jack.stage5.3" = "[placeholder] I'd bet each room holds one of the statue's five weapons."
"cwk.jack.stage5.4" = "[placeholder] Bring the weapons back and set them on the Relic of Mastery!"
"cwk.jack.rest" = "[placeholder] Nice work back there! This way leads to the Twisted Masters' armory."
"cwk.stirges.gone" = "[placeholder] The stirges are gone."
