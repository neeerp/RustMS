"cwk.room.taken" = "[placeholder] This chamber's weapon has already been taken."
"cwk.room.guardians" = "[placeholder] Defeat every Crimson Guardian here first."
"cwk.room.masters" = "[placeholder] Defeat every Master Guardian here first."
