"lilin.new_beginnings.ask" = "[placeholder] Training is the only way. Take this polearm and begin again. Ready?"
"lilin.new_beginnings.go" = "[placeholder] Head west of Rien to the training center and find #b#p1202006##k. Puo will start your training."
"lilin.new_beginnings.declined" = "[placeholder] Rest a little, then come back to me."
"lilin.new_beginnings.full" = "[placeholder] Make room in your Equip inventory first."
