"amoria_pq.lobby.menu" = "[placeholder] The Amorian Challenge is for brave married couples. Gather a party and have its leader speak with me."
"amoria_pq.lobby.enter" = "[placeholder] We'd like to take on the challenge."
"amoria_pq.lobby.leave" = "[placeholder] Take me back to the training ground."
"amoria_pq.lobby.about" = "[placeholder] Tell me about the challenge."
"amoria_pq.lobby.info" = "[placeholder] The challenge is a string of puzzles a party can only solve together. Clear them all and a bonus stage full of prizes awaits, a richer one if every member came with their spouse."
"amoria_pq.lobby.no_party" = "[placeholder] You'll need to be in a party to take the challenge."
"amoria_pq.lobby.not_leader" = "[placeholder] Have your party's leader speak with me."
"amoria_pq.lobby.not_eligible" = "[placeholder] Your party can't start yet. It must be {least} married members, men and women both, all of level {low} or above and all here with you."
"amoria_pq.lobby.busy" = "[placeholder] Another party is taking the challenge on this channel. Try another channel, or wait until they're done."
"amoria_pq.exit.ask" = "[placeholder] Shall I send you back to Amos's training ground?"
"amoria_pq.amos.cleared" = "[placeholder] The way on is open. Go on to the trials ahead."
"amoria_pq.amos.not_leader" = "[placeholder] Have your party's leader speak with me."
"amoria_pq.stage1.intro" = "[placeholder] Welcome to the first stage of the Amorian Challenge. The Glimmer Man below will tell you what to do. Break the Magik Mirror down there, bring a shard of it to the Glimmer Man, then come back to me to go on."
"amoria_pq.stage1.see_glimmer" = "[placeholder] Ask the Glimmer Man below about this stage."
"amoria_pq.stage2.intro" = "[placeholder] Welcome to the second stage. Five of your party must climb the ropes up there, so many on each rope, to find the weight that opens the way on. Speak to me when they're in place and I'll tell you how it went. Miss too many times and monsters will come for you."
"amoria_pq.stage2.mobs" = "[placeholder] Beat every monster here before you try again."
"amoria_pq.stage2.few" = "[placeholder] That's no answer yet. Exactly five of you must hang on the ropes, and stay still while I look, or it won't count."
"amoria_pq.stage2.all_differ" = "[placeholder] None of the ropes holds the weight it should. Think it over and try again."
"amoria_pq.stage2.all_differ_notice" = "[placeholder] Amos: None of the ropes holds the right weight."
"amoria_pq.stage2.one_same" = "[placeholder] One rope holds the weight it should. Think it over and try again."
"amoria_pq.stage2.one_same_notice" = "[placeholder] Amos: One rope holds the right weight."
"amoria_pq.stage2.reset" = "[placeholder] Too many misses. The weights have changed, so start again from the beginning!"
"amoria_pq.stage2.reset_notice" = "[placeholder] Amos: Too many misses. The weights have changed, so start again!"
"amoria_pq.stage3.intro" = "[placeholder] Welcome to the third stage. Five of your party must each take a platform of their own up there, and only the right five open the way on. Speak to me when they're in place. When a try misses, count the slimes that turn up: there's one for each of you on a right platform."
"amoria_pq.stage3.few" = "[placeholder] That's no answer yet. Exactly five of you must stand on the platforms, and stay still while I look, or it won't count."
"amoria_pq.stage4.intro" = "[placeholder] Welcome to the fourth stage. The monsters here carry #b#t{item}##k: gather {n} of them, and your leader can bring them to me."
"amoria_pq.stage4.short" = "[placeholder] I asked for #r{n} #t{item}##k, and you don't have them all yet."
"amoria_pq.stage4.done" = "[placeholder] That's all of them. The way on is open."
"amoria_pq.stage4.notice" = "[placeholder] Amos: Time is short now. Open every gate on the next map and meet on its far side."
"amoria_pq.stage5.intro" = "[placeholder] Welcome to the fifth stage. Hit every gate between here and the start until it opens, then bring the whole team here to me, and your leader can talk to me again."
"amoria_pq.stage5.apart" = "[placeholder] Your team isn't all here yet. Everyone has to stand here with me first."
"amoria_pq.stage5.teleported" = "[placeholder] Some of the gates are still shut. A shortcut won't do: every gate has to be opened."
"amoria_pq.stage5.done" = "[placeholder] Everyone is here and every gate is open. Talk to me again when you're ready for the Geist Balrog."
"amoria_pq.stage5.notice" = "[placeholder] Amos: Only the Geist Balrog is left. Talk to Amos to go on."
"amoria_pq.stage5.gate_shut" = "[placeholder] This gate is still shut."
"amoria_pq.stage6.fang" = "[placeholder] Beat the Geist Balrog and bring me its #b#t{item}##k. This is your last trial!"
"amoria_pq.stage6.done" = "[placeholder] The Geist Balrog is beaten: you've completed the Amorian Challenge! Talk to me again for the bonus stage."
"amoria_pq.bonus.hurry" = "[placeholder] The bonus stage is nearly over. Make the most of what time is left!"
