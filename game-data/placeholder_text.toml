"violetta.key_luck" = "[placeholder] Violetta wishes you luck one last time."
"violetta.key_full" = "[placeholder] You need a free ETC slot for the key."
"snow_statue.clue" = "[placeholder] Something in the shattered statue looks like a clue. Better tell Scadur."
"lost_memory.regained" = "[placeholder] Your memories come back. The Memory Keeper has the pass for you."
"black_shadow.nothing" = "[placeholder] (Nothing out of the ordinary here.)"
"black_shadow.spotted" = "[placeholder] (A black shadow darts off between the trees! #p1103001# should hear of this.)"
"black_shadow.ambush" = "[placeholder] (A black shadow rises from the shelves, and angry monsters spill out all around!)"
"portal.outMagiclib.mushrooms_left" = "[placeholder] The way out stays shut while any Blue Mushroom here still stands."
"puppeteer_door.ask" = "[placeholder] A voice from behind the cave wall: \"Who goes there? #bThe password#k!\""
"puppeteer_door.wrong" = "[placeholder] #rThat isn't the password.#k The wall stays still."
"puppeteer_door.shut" = "[placeholder] The password was right, but something still holds the way shut."
"puppeteer_door.searched" = "[placeholder] (No sign of the Puppeteer here, and some strong force bars the way. Better tell #b#p1061019##k.)"
