"francis.hideout_busy" = "[placeholder] Someone is already in the hideout. Come back later."
"fake_tru.call" = "[placeholder] Something urgent has come up. Come to the #m104000004# at once!"
"tru.puppeteer_beaten" = "[placeholder] That call wasn't mine. The Puppeteer used my name to draw you here, but you drove him off."
"tru.polearm_mastery" = "[placeholder] This skill was sent here for you. Take it: #bPolearm Mastery#k."
"tru.puppeteer_traces" = "[placeholder] The Puppeteer slipped away, but the trail leads through the cave at #m105040201#. Follow it to the end and settle this."
"tru.puppeteer_trail_beaten" = "[placeholder] You caught up with the Puppeteer at the end of the passage? Then the Black Wings have lost their puppet master for a while."
"tru.combo_drain" = "[placeholder] While you were away, I found another of your lost skills. Take it back: #bCombo Drain#k."
"tru.seal_stone.news" = "[placeholder] The Black Wings are after the seal stones. Victoria Island's must not fall into their hands."
"tru.seal_stone.given" = "[placeholder] Take this #b#t4032323##k to #b#p1201000##k in Rien. Lilin will know what to make of it."
"tru.seal_stone.full" = "[placeholder] Make room in your Etc inventory first."
"lilin.seal_stone" = "[placeholder] Tru sent the seal stone here to keep it safe? Good. It will be safer in Rien than anywhere on Victoria Island. Thank you."
"tru.orbis.news" = "[placeholder] Word has come from Orbis: the Black Wings have been seen there too."
"tru.orbis.ask" = "[placeholder] Will you go to Orbis and find out what they want?"
"tru.orbis.go" = "[placeholder] Look for #b#p2012012##k in Orbis. Lisa will tell you more."
"tru.orbis.declined" = "[placeholder] Come back when you're ready to travel."
"passage_statue.ask" = "[placeholder] The Puppeteer waits beyond this statue. Are you ready for the fight?"
"passage_statue.busy" = "[placeholder] Someone is already facing the Puppeteer. Try again later."
"passage_exit.ask" = "[placeholder] Leave the passage?"
"spiruna.sealed_garden.news" = "[placeholder] So the Black Wings are in Orbis. They will be after the garden that was sealed long ago, below the Neglected Strolling Path."
"spiruna.sealed_garden.ask" = "[placeholder] Something guards that garden still. Will you look into it?"
"spiruna.sealed_garden.declined" = "[placeholder] Then leave an old refiner to the work at hand."
"spiruna.garden_cleared" = "[placeholder] You beat the guardian of the Sealed Garden? Then the Black Wings won't find it easy going. Take this for your trouble."
"tru.orbis_stone_stolen" = "[placeholder] Bad news: the Black Wings have taken the Orbis seal stone. Tell #b#p1201000##k in Rien at once."
"lilin.orbis_stone" = "[placeholder] The Orbis seal stone, stolen? That is grave news indeed."
"lilin.combo_smash" = "[placeholder] You will need more strength against the Black Wings. I found another of your lost skills: #bCombo Smash#k."
"tru.mu_lung.news" = "[placeholder] I've heard the Black Wings have been in touch with someone in #m250000000#."
"tru.mu_lung.ask" = "[placeholder] It's a long way, but will you go and find out what they wanted?"
"tru.mu_lung.keyword" = "[placeholder] Ask #b#p2090004##k there about the Shadow Knight of the Black Wings. Be patient; Mr. Do is known to be curt."
"tru.mu_lung.declined" = "[placeholder] Come back when you're ready to travel."
"mr_do.black_scroll.met" = "[placeholder] The Shadow Knight? Yes, someone in black came by and left a #bHanging Scroll#k for me to take to Mu Gong."
"mr_do.black_scroll.ask" = "[placeholder] There's a small problem, though. Will you hear me out?"
"mr_do.black_scroll.soaked" = "[placeholder] I dropped the scroll into a pot of boiling herbs, and the writing washed away."
"mr_do.black_scroll.jin_jin" = "[placeholder] #b#p2091008##k, the artist down the road, may know how to bring the writing back. Take the scroll and feed it #b#t4032342##k until the writing returns."
"mr_do.black_scroll.full" = "[placeholder] Make room in your Etc inventory first."
"mr_do.black_scroll.read" = "[placeholder] The writing is back! It says the Black Wings will come for Mu Lung's seal stone..."
"portal.enterNepenthes.occupied" = "[placeholder] Someone is already taking on the Sealed Garden."
"portal.enterBackStreet.no_entry" = "[placeholder] You may not go this way."
"mu_gong.test" = "[placeholder] A letter from the Shadow Knight, and you ask me of the seal stone? Show me what you are made of first. Beat my clone in my arena."
"mu_gong.arena_busy" = "[placeholder] Someone is already facing my clone. Come back in a while."
"mu_gong.shadow_knight.ask" = "[placeholder] The seal stone lies in the Sealed Shrine, and the Shadow Knight is headed there. Will you stop the knight?"
"mu_gong.shadow_knight.password" = "[placeholder] Find the pillar marked \"Entrance\" between the temple's pillars and say #bActions speak louder than words#k. Then stop the Shadow Knight."
"mu_gong.stone_taken.news" = "[placeholder] You beat the Shadow Knight, yet the stone is gone? The Black Wings are cunning."
"mu_gong.stone_taken.tru" = "[placeholder] I never knew what that stone was for. Tell Tru what happened here."
"shrine_pillar.ask" = "[placeholder] The pillar reads \"Entrance\". Say the password."
"shrine_pillar.wrong" = "[placeholder] Nothing happens."
"shrine_pillar.shut" = "[placeholder] The password is right, but something keeps the way shut."
"shrine_pillar.busy" = "[placeholder] Someone is already inside the Sealed Shrine."
"lilin.mu_lung_stone" = "[placeholder] The Mu Lung seal stone is gone too? Still, we now know the heroes themselves left the stones in those towns."
"lilin.final_charge" = "[placeholder] And I have deciphered another of your skills. Here, take back #bFinal Charge#k."
"tru.back_to_the_past.news" = "[placeholder] One of Ludibrium's clocktowers has broken, and it opened a way into the past, close to your own time."
"tru.back_to_the_past.gate" = "[placeholder] Climb Helios Tower to its time-control room and go through. Then come tell me what you find."
"athena.remembers.aran" = "[placeholder] Aran! You're alive, after all this time!"
"athena.remembers.sorry" = "[placeholder] You don't remember me? ...Then I'll remember for both of us."
"athena.letter_promise.letter" = "[placeholder] The stone is gone, but I have a letter about another one. You can't carry it, though: you don't belong to this time."
"athena.letter_promise.your_time" = "[placeholder] I live a long time. I'll bring it to you myself. Find me in your own time."
"athena.letter" = "[placeholder] You came back, just as I knew you would. Here is the letter I promised to keep."
"athena.letter.full" = "[placeholder] Make room in your Etc inventory first."
"neinheart.letter" = "[placeholder] A letter from Lilin about a seal stone? I'll consider it."
"lilin.new_beginnings.remember" = "[placeholder] You remember a little? Even a few of your old skills? That's a start."
